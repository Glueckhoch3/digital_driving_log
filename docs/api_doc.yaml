openapi: 3.1.0
info:
  title: Digital Driving Log
  description: |-
    A comprehensive digital solution for managing shared vehicle driving logs and cost distribution.
    
    Some useful links:
    - [Digital-Driving-Log repository](https://github.com/Glueckhoch3/digital_driving_log)
    - [The source API definition for the DDL](https://github.com/Glueckhoch3/digital_driving_log/blob/main/docs/api_doc.yaml)

  license:
    name: License MIT
    url: https://github.com/Glueckhoch3/digital_driving_log/blob/main/LICENSE
  version: 0.0.1
servers:
  - url: https://localhost:8080/api

tags:
  - name: drives
    description: Access for logging and fetching driving logs.
  
  - name: costs
    description: Access for Cost data creation and retrieval.

paths:
  /drives:
    get:
      tags:
        - drives
      summary: Get all drives
      description: Retrieve a list of all drives
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Drive'
        '404':
          description: No drives found
  /drives/{id}:
    get:
      tags:
        - drives
      summary: Get a drive by ID
      description: Retrieve a specific drive by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drive'
        '404':
          description: Drive not found
    put:
      tags:
        - drives
      summary: Update a drive
      description: Update an existing drive by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Drive'
      responses:
        '200':
          description: Drive updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drive'
        '404':
          description: Drive not found
    delete:
      tags:
        - drives
      summary: Delete a drive
      description: Delete a drive by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Drive deleted
        '404':
          description: Drive not found
  /drives/vehicle/{carId}:
    get:
      tags:
        - drives
      summary: Get drives for a car
      description: Retrieve all drives for a specific car
      parameters:
        - name: carId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Drive'
        '404':
          description: Car not found
    post:
      tags:
        - drives
      summary: Create a new drive
      description: Create a new drive entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Drive'
      responses:
        '201':
          description: Drive created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drive'
        '400':
          description: Invalid input
  /costs:
    get:
      tags:
        - costs
      summary: Get all costs
      description: Retrieve all costs
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cost'
        '404':
          description: No costs found
  /costs/{id}:
    get:
      tags:
        - costs
      summary: Get a cost by ID
      description: Retrieve a specific cost by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cost'
        '404':
          description: Cost not found
    put:
      tags:
        - costs
      summary: Update a cost
      description: Update an existing cost by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cost'
      responses:
        '200':
          description: Cost updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cost'
        '404':
          description: Cost not found
    delete:
      tags:
        - costs
      summary: Delete a cost
      description: Delete a cost by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Cost deleted
        '404':
          description: Cost not found
  /costs/vehicles/{carId}:
    get:
      tags:
        - costs
      summary: Get costs for a car
      description: Retrieve all costs for a specific car
      parameters:
        - name: carId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cost'
        '404':
          description: Car not found
    post:
      tags:
        - costs
      summary: Create a new cost
      description: Create a new cost entry for a car
      parameters:
        - name: carId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cost'
      responses:
        '201':
          description: Cost created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cost'
        '400':
          description: Invalid input

components:
  schemas:
    Drive:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date-time
        driver:
          type: string
        distance:
          type: number
        notes:
          type: string
      required:
        - date
        - driver
        - distance
    Cost:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [fixed, variable]
        price:
          type: number
        amount:
          type: number
        shareholder:
          type: string
        date:
          type: string
          format: date-time
        description:
          type: string
        category:
          type: string
      required:
        - type
        - price
        - amount
        - shareholder
        - date
        - description
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message