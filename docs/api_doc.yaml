openapi: 3.1.0
info:
  title: Digital Driving Log
  description: |-
    A comprehensive digital solution for managing shared vehicle driving logs and cost distribution.
    
    Some useful links:
    - [Digital-Driving-Log repository](https://github.com/Glueckhoch3/digital_driving_log)
    - [The source API definition for the DDL](https://github.com/Glueckhoch3/digital_driving_log/blob/main/docs/api_doc.yaml)

  license:
    name: License MIT
    url: https://github.com/Glueckhoch3/digital_driving_log/blob/main/LICENSE
  version: 0.0.1
servers:
  - url: https://localhost:8080/api

tags:
  - name: drives
    description: Access for logging and fetching driving logs.
  
  - name: costs
    description: Access for Cost data creation and retrieval.

paths:
  /drives/vehicle/{carId}:
    get:
      tags:
        - drives
      summary: Get drives for a car
      description: Retrieve all drives for a specific car
      parameters:
        - name: carId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Drive'
        '404':
          description: Car not found
    post:
      tags:
        - drives
      summary: Create a new drive
      description: Create a new drive entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Drive'
      responses:
        '201':
          description: Drive created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drive'
        '400':
          description: Invalid input
  /drives/{id}:
    put:
      tags:
        - drives
      summary: Update a drive
      description: Update an existing drive by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Drive'
      responses:
        '200':
          description: Drive updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drive'
        '404':
          description: Drive not found
    delete:
      tags:
        - drives
      summary: Delete a drive
      description: Delete a drive by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Drive deleted
        '404':
          description: Drive not found
  /costs/vehicles/{carId}:
    get:
      tags:
        - costs
      summary: Get costs for a car
      description: Retrieve all costs for a specific car
      parameters:
        - name: carId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cost'
        '404':
          description: Car not found
    post:
      tags:
        - costs
      summary: Create a new cost
      description: Create a new cost entry for a car
      parameters:
        - name: carId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cost'
      responses:
        '201':
          description: Cost created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cost'
        '400':
          description: Invalid input
  /costs/{id}:
    put:
      tags:
        - costs
      summary: Update a cost
      description: Update an existing cost by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cost'
      responses:
        '200':
          description: Cost updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cost'
        '404':
          description: Cost not found
    delete:
      tags:
        - costs
      summary: Delete a cost
      description: Delete a cost by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Cost deleted
        '404':
          description: Cost not found

components:
  schemas:
    Drive:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date-time
        driver:
          type: string
        distance:
          type: number
        notes:
          type: string
      required:
        - date
        - driver
        - distance
    FuelRefill:
      allOf:
        - $ref: '#/components/schemas/Cost'
        - type: object
          properties:
            type:
              type: string
              enum: [variable]
            description:
              type: string
              enum: ['Fuel Refill']
            category:
              type: string
              enum: ['Fuel']
    Cost:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [fixed, variable]
        price:
          type: number
        amount:
          type: number
        shareholder:
          type: string
        date:
          type: string
          format: date-time
        description:
          type: string
        category:
          type: string
      required:
        - type
        - price
        - amount
        - shareholder
        - date
        - description
    CostDistribution:
      type: object
      properties:
        shareholder:
          type: string
        totalOwed:
          type: number
        fixedCosts:
          type: number
        variableCosts:
          type: number
        fuelCosts:
          type: number
        distance:
          type: number
      required:
        - shareholder
        - totalOwed
        - fixedCosts
        - variableCosts
        - fuelCosts
        - distance
    CostSummary:
      type: object
      properties:
        totalFixed:
          type: number
        totalVariable:
          type: number
        totalFuel:
          type: number
        totalCosts:
          type: number
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/CostDistribution'
      required:
        - totalFixed
        - totalVariable
        - totalFuel
        - totalCosts
        - distributions
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message