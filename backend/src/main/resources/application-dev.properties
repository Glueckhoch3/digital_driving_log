# application-dev.properties
# Development configuration for the Digidrivelog application

# activates security logging
logging.level.org.springframework.security=DEBUG

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:create-drop}

# datasource for local development
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/digidrivelog}
spring.datasource.username=${POSTGRES_USER:digidrivelog}
spring.datasource.password=${POSTGRES_PASSWORD:secret}

# Quote SQL identifiers globally to avoid reserved-word conflicts in H2
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
