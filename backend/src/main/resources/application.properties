spring.application.name=digidrivelog

# Import environment variables from .env file, if it exists
spring.config.import=optional:file:.env[.properties]

# Server configuration
server.port=${PORT:8080}

# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Production config
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/digidrivelog}
spring.datasource.username=${POSTGRES_USER:digidrivelog}
spring.datasource.password=${POSTGRES_PASSWORD:secret}

# JPA Configuration
# Production default: validate only — schema changes are a deliberate step
# (Flyway planned before first real deployment, see ADR-012).
# Dev profile still uses create-drop (application-dev.properties).
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql = true
spring.datasource.hikari.auto-commit=true
# Batch inserts/updates for the fast-growing Drive/Cost tables (SEQUENCE ids enable this).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.sql.init.mode=always

# Accept lower/mixed-case enum values (e.g. "variable" -> VARIABLE) on input.
spring.jackson.mapper.accept-case-insensitive-enums=true
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
