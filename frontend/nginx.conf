server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access: the browser only ever talks to this server, so the
    # app works from any device on the LAN without per-host CORS configuration.
    location /ddl/api/ {
        proxy_pass http://backend:8080/ddl/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CSV imports are streamed through unbuffered and may take a while.
        proxy_request_buffering off;
        client_max_body_size 25m;
        proxy_read_timeout 300s;
    }
}
