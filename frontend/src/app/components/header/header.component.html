<header class="header">
  <div class="header__container">
    <div class="header__logo">
      <h1>{{ 'header.title' | translate }}</h1>
    </div>

    <button
      class="header__burger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Toggle navigation menu"
    >
      <span class="header__burger-line"></span>
      <span class="header__burger-line"></span>
      <span class="header__burger-line"></span>
    </button>

    <nav class="header__nav header__nav--desktop">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="header__nav-link"
      >
        {{ item.labelKey | translate }}
      </a>
    </nav>

    <div class="header__language-selector">
      <select [value]="currentLang()" (change)="changeLang($event)" class="header__language-select">
        <option value="en">{{ 'header.language.en' | translate }}</option>
        <option value="de">{{ 'header.language.de' | translate }}</option>
      </select>
    </div>
  </div>

  @if (isMenuOpen()) {
    <nav class="header__nav header__nav--mobile">
      <div class="header__mobile-close">
        <button
          class="header__mobile-close-btn"
          (click)="closeMenu()"
          aria-label="Close navigation menu"
        >
          ✕
        </button>
      </div>
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="header__nav-link"
        (click)="closeMenu()"
      >
        {{ item.labelKey | translate }}
      </a>
    </nav>
  }
</header>
