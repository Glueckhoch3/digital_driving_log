<section class="page page--narrow">
  <a class="crumb" [routerLink]="['/cars', car().carId, 'drives']"
    ><app-icon name="left" [small]="true" />{{ 'carWorkspace.driveForm.backToList' | translate }}</a
  >
  @if (car()) {
    <h2>{{ 'carWorkspace.driveForm.title' | translate }} — {{ car().name }}</h2>
  }

  @if (message()) {
    <p #statusRegion class="msg msg--ok" role="status" aria-live="polite" tabindex="-1">
      {{ message() | translate }}
    </p>
  }

  @if (error()) {
    <p class="msg msg--error" role="alert" aria-live="assertive">
      {{ error() | translate }}
    </p>
  }

  <form class="form" #driveFormEl [formGroup]="driveForm" (ngSubmit)="saveDrive()">
    <label for="drive-driveDate">{{ 'carWorkspace.driveForm.driveDate' | translate }}</label>
    <input
      id="drive-driveDate"
      type="date"
      formControlName="driveDate"
      [attr.aria-invalid]="
        driveForm.controls.driveDate.invalid && driveForm.controls.driveDate.touched
      "
      [attr.aria-describedby]="
        driveForm.controls.driveDate.invalid && driveForm.controls.driveDate.touched
          ? 'drive-driveDate-error'
          : null
      "
    />
    <app-field-error id="drive-driveDate-error" [control]="driveForm.controls.driveDate" />

    <label for="drive-odometer">{{ 'carWorkspace.driveForm.odometer' | translate }}</label>
    <span class="form__hint" id="drive-odometer-hint">{{
      'carWorkspace.driveForm.odometerHint' | translate
    }}</span>
    <input
      id="drive-odometer"
      type="number"
      formControlName="odometer"
      min="1"
      [attr.aria-invalid]="
        driveForm.controls.odometer.invalid && driveForm.controls.odometer.touched
      "
      [attr.aria-describedby]="
        driveForm.controls.odometer.invalid && driveForm.controls.odometer.touched
          ? 'drive-odometer-hint drive-odometer-error'
          : 'drive-odometer-hint'
      "
    />
    <app-field-error id="drive-odometer-error" [control]="driveForm.controls.odometer" />

    <label for="drive-driverId">{{ 'carWorkspace.driveForm.driver' | translate }}</label>
    <select
      id="drive-driverId"
      formControlName="driverId"
      [attr.aria-invalid]="
        driveForm.controls.driverId.invalid && driveForm.controls.driverId.touched
      "
      [attr.aria-describedby]="
        driveForm.controls.driverId.invalid && driveForm.controls.driverId.touched
          ? 'drive-driverId-error'
          : null
      "
    >
      @for (user of users(); track user.userId) {
        <option [value]="user.userId">{{ user.firstname }} {{ user.lastname }}</option>
      }
    </select>
    <app-field-error id="drive-driverId-error" [control]="driveForm.controls.driverId" />

    <label for="drive-notes">{{ 'carWorkspace.driveForm.notes' | translate }}</label>
    <textarea id="drive-notes" rows="3" formControlName="notes"></textarea>

    <div class="form__actions">
      <button type="submit">{{ 'carWorkspace.driveForm.submit' | translate }}</button>
    </div>
  </form>
</section>
